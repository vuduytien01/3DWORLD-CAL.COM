volumes:
  database-data:
  redis-data:

networks:
  stack:
    name: stack
    external: false

services:
  database:
    container_name: database
    image: postgres:16-alpine
    restart: always
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=unicorn_user
      - POSTGRES_PASSWORD=magical_password
      - POSTGRES_DB=calendso
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicorn_user -d calendso"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - stack
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  calcom:
    container_name: calcom-web
    image: calcom/cal.com:latest
    restart: always
    networks:
      - stack
    ports:
      - "3010:3000"
    env_file: .env
    environment:
      - DATABASE_HOST=database:5432
      - NEXT_PUBLIC_WEBAPP_URL=http://localhost:3010
      - NEXTAUTH_URL=http://localhost:3010
      - NEXTAUTH_URL_INTERNAL=http://calcom-web:3000
      - DAILY_API_KEY=${DAILY_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - RETELL_AI_KEY=${RETELL_AI_KEY}
      - DATABASE_URL=postgresql://unicorn_user:magical_password@database:5432/calendso
      - DATABASE_DIRECT_URL=postgresql://unicorn_user:magical_password@database:5432/calendso
      - HOSTED_CAL_FEATURES=1
      - CALCOM_TELEMETRY_DISABLED=1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  calcom-api:
    container_name: calcom-api
    image: calcom/cal.com:latest
    restart: always
    networks:
      - stack
    ports:
      - "8090:80"
    env_file: .env
    environment:
      - DATABASE_HOST=database:5432
      - DATABASE_URL=postgresql://unicorn_user:magical_password@database:5432/calendso
      - DATABASE_DIRECT_URL=postgresql://unicorn_user:magical_password@database:5432/calendso
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  studio:
    container_name: caldiy-studio-1
    image: calcom/cal.com:latest
    restart: always
    networks:
      - stack
    ports:
      - "5556:5555"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://unicorn_user:magical_password@database:5432/calendso
      - DATABASE_DIRECT_URL=postgresql://unicorn_user:magical_password@database:5432/calendso
    depends_on:
      database:
        condition: service_healthy
    command: ["npx", "prisma", "studio", "--hostname", "0.0.0.0"]
    healthcheck:
      disable: true

  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    networks:
      - stack
    command: tunnel --url http://calcom-web:3000
    depends_on:
      calcom:
        condition: service_started
      calcom-api:
        condition: service_started